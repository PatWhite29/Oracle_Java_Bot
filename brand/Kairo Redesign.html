/* ─── KAIRO LOGO MARK ─── */
function KairoMark({ size = 36 }) {
  const s = size / 80;
  return (
    <svg width={size} height={size} viewBox="0 0 80 80" fill="none" style={{flexShrink:0}}>
      <rect width="80" height="80" rx="18" fill={T.navy}/>
      <rect x="1" y="1" width="78" height="78" rx="17" stroke="rgba(255,255,255,0.12)" strokeWidth="1.5" fill="none"/>
      <line x1="23" y1="18" x2="23" y2="62" stroke="white" strokeWidth="3" strokeLinecap="round"/>
      <line x1="23" y1="40" x2="55" y2="18" stroke="white" strokeWidth="3" strokeLinecap="round"/>
      <line x1="23" y1="40" x2="55" y2="62" stroke="white" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="23" cy="18" r="5" fill={T.navy} stroke="white" strokeWidth="2.5"/>

      <circle cx="23" cy="40" r="3.5" fill="white"/>
    </svg>
  );
}

/* ─── BADGE ─── */
function Badge({ value }) {
  const c = STATUS_COLORS[value] || { bg:T.n100, text:T.n500 };
  return (
    <span style={{
      display:'inline-block', padding:'2px 8px', borderRadius:4,
      fontSize:11, fontWeight:700, letterSpacing:'0.01em',
      background:c.bg, color:c.text, whiteSpace:'nowrap',
    }}>{value?.replace('_',' ')}</span>
  );
}

/* ─── BUTTON ─── */
function Btn({ children, variant='primary', size='md', onClick, disabled, style, accent='oracle' }) {
  const [hov, setHov] = useState(false);
  const accentColor = accent === 'oracle' ? T.oracle : T.navy;
  const accentHover = accent === 'oracle' ? T.oracleDark : '#002A4C';
  const base = {
    display:'inline-flex', alignItems:'center', gap:6,
    fontWeight:600, letterSpacing:'0.01em',
    transition:'all 0.15s ease',
    cursor: disabled ? 'not-allowed' : 'pointer',
    opacity: disabled ? 0.45 : 1, border:'none',
  };
  const sizes = {
    sm:  { padding:'5px 12px', fontSize:12, borderRadius:7 },
    md:  { padding:'9px 18px', fontSize:13, borderRadius:9 },
    lg:  { padding:'13px 28px', fontSize:15, borderRadius:10 },
  };
  const variants = {
    primary:   { background: hov ? accentHover : accentColor, color:'white' },
    navy:      { background: hov ? '#002A4C' : T.navy, color:'white' },
    secondary: { background: hov ? T.n200 : T.n100, color:T.n800, border:`1px solid ${T.n200}` },
    danger:    { background: hov ? '#B91C1C' : '#DC2626', color:'white' },
    ghost:     { background: hov ? T.n100 : 'transparent', color:T.n600 },
    outline:   { background:'transparent', color: accentColor, border:`1.5px solid ${accentColor}` },
  };
  return (
    <button
      onClick={disabled ? null : onClick}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{...base,...sizes[size],...variants[variant],...style}}
    >{children}</button>
  );
}

/* ─── INPUT ─── */
function Input({ label, placeholder, type='text', value, onChange, helper, error, required }) {
  const [focused, setFocused] = useState(false);
  const [showPw, setShowPw] = useState(false);
  const isPassword = type === 'password';
  return (
    <div style={{display:'flex',flexDirection:'column',gap:5}}>
      {label && (
        <label style={{fontSize:12,fontWeight:600,color:T.n700,display:'flex',gap:3}}>
          {label}{required && <span style={{color:T.oracle}}>*</span>}
        </label>
      )}
      <div style={{position:'relative'}}>
        <input
          type={isPassword && showPw ? 'text' : type}
          placeholder={placeholder}
          value={value}
          onChange={onChange}
          onFocus={()=>setFocused(true)}
          onBlur={()=>setFocused(false)}
          style={{
            padding: isPassword ? '9px 36px 9px 13px' : '9px 13px',
            border:`1.5px solid ${error ? T.oracle : focused ? T.navyMid : T.n200}`,
            borderRadius:9, fontSize:14, color:T.n900,
            outline:'none', background:'white', width:'100%',
            boxShadow: focused ? `0 0 0 3px ${error ? 'rgba(199,70,52,0.10)' : 'rgba(0,85,135,0.10)'}` : 'none',
            transition:'border-color 0.15s, box-shadow 0.15s',
          }}
        />
        {isPassword && (
          <button
            type="button"
            onClick={()=>setShowPw(v=>!v)}
            style={{position:'absolute',right:11,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:T.n400,cursor:'pointer',display:'flex',alignItems:'center',padding:0}}
          >{showPw ? Icons.eyeOff : Icons.eye}</button>
        )}
      </div>
      {helper && !error && <span style={{fontSize:11,color:T.n400}}>{helper}</span>}
      {error && <span style={{fontSize:11,color:T.oracle}}>{error}</span>}
    </div>
  );
}

  function NavItem({ id, icon, label, sub }) {
    const active = screen === id;

/* ─────────────────────────────────────────
   APP SHELL + ROOT
   ───────────────────────────────────────── */
function AppShell({ children, screen, setScreen, tweaks }) {
  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:T.n100}}>
      <Sidebar screen={screen} setScreen={setScreen} tweaks={tweaks}/>
      <main style={{flex:1,overflow:'auto'}}>
        {children}
      </main>
    </div>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('login');
  const isAuth = screen !== 'login' && screen !== 'register';

  const SCREENS = {
    projects:  <ProjectsPage setScreen={setScreen} tweaks={tweaks}/>,
    tasks:     <TasksPage tweaks={tweaks}/>,
    sprints:   <SprintsPage tweaks={tweaks}/>,
    backlog:   <BacklogPage tweaks={tweaks}/>,
    members:   <MembersPage tweaks={tweaks}/>,
    dashboard: <div style={{padding:32}}><h1 style={{fontFamily:'Manrope',fontSize:22,fontWeight:800,color:T.n500}}>Dashboard — coming soon</h1></div>,
    profile:   <ProfilePage tweaks={tweaks}/>,
  };

  const LoginComp = tweaks.loginVariant === 'A' ? LoginA : LoginB;
  if (screen === 'register') return (
    <RegisterPage
      variant={tweaks.loginVariant}
      onRegister={()=>setScreen('projects')}
      onBack={()=>setScreen('login')}
    />
  );
  if (!isAuth) return <LoginComp onLogin={(dest)=>setScreen(dest==='register'?'register':'projects')}/>;

  return (
    <>
      <AppShell screen={screen} setScreen={setScreen} tweaks={tweaks}>
        {SCREENS[screen] || SCREENS['projects']}
      </AppShell>
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection title="Login">
          <TweakRadio id="loginVariant" label="Variant"
            options={[{value:'A',label:'Dark card'},{value:'B',label:'Split panel'}]}
            value={tweaks.loginVariant} onChange={v=>setTweak('loginVariant',v)}/>
        </TweakSection>
        <TweakSection title="Sidebar">
          <TweakRadio id="sidebarStyle" label="Color"
            options={[{value:'navy',label:'Navy'},{value:'dark',label:'Dark'},{value:'light',label:'Light'}]}
            value={tweaks.sidebarStyle} onChange={v=>setTweak('sidebarStyle',v)}/>
        </TweakSection>
        <TweakSection title="Brand accent">
          <TweakRadio id="brandAccent" label="Primary"
            options={[{value:'oracle',label:'Oracle red'},{value:'itesm',label:'ITESM blue'}]}
            value={tweaks.brandAccent} onChange={v=>setTweak('brandAccent',v)}/>
        </TweakSection>
        <TweakSection title="Layout">
          <TweakRadio id="density" label="Density"
            options={[{value:'compact',label:'Compact'},{value:'comfortable',label:'Comfortable'}]}
            value={tweaks.density} onChange={v=>setTweak('density',v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
